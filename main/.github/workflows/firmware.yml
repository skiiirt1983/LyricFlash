name: LyricFlash Alpha 0.3 - ESP32-S3 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32s3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf:v5.5.4
    steps:
      - name: Check out firmware source
        uses: actions/checkout@v4
      - name: Run host tests before compiling
        shell: bash
        run: bash tests/run_tests.sh
      - name: Compile LyricFlash for ESP32-S3
        shell: bash
        run: |
          idf.py set-target esp32s3
          idf.py build
      - name: Verify generated application image
        shell: bash
        run: |
          python3 tools/check_build.py build/lyricflash.bin
      - name: Package firmware and build manifest
        shell: bash
        run: |
          mkdir -p dist
          cp build/lyricflash.bin dist/LyricFlash_Alpha_0.3_ESP32S3_OTA.bin
          python3 tools/check_build.py build/lyricflash.bin --json > dist/build-checks.json
          sha256sum dist/*.bin > dist/SHA256SUMS.txt
          python3 - <<'PYCODE'
          import json, pathlib
          d={"release":"alpha-0.3","board":"ESP32-S3-Touch-AMOLED-1.75","type":"application-only OTA","flash_offset":"NOT FOR 0x0 FLASH","toolchain":"ESP-IDF v5.5.4","hardware_tested":False,"ota_from_printsphere_verified":False}
          pathlib.Path('dist/BUILD_README.json').write_text(json.dumps(d,indent=2)+'\n')
          PYCODE
      - name: Downloadable compiled image (only after build passes)
        uses: actions/upload-artifact@v4
        with:
          name: LyricFlash-Alpha-0.3-ESP32S3-UNTESTED
          path: dist/
          if-no-files-found: error
