name: Draft 0.8.62 Google Fonts - preflight and compile only
on:
  workflow_dispatch:
  push:
    branches:
      - feature/private-0.8.62-context-clock-studio
    paths:
      - '.github/workflows/verify-clock-fonts.yml'
      - 'THIRD_PARTY_NOTICES.md'
      - 'tools/generate_clock_fonts.py'
      - 'main/CMakeLists.txt'
      - 'main/clock_fonts.c'
      - 'main/clock_fonts.h'
      - 'main/basic_clock.c'
permissions:
  contents: read
jobs:
  validate-and-compile:
    # Explicitly gate expensive ESP-IDF builds. A normal source edit cannot
    # start another full compile or publish any OTA firmware.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[font-compile-once]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - name: All existing LyricFlash preflight and web preview tests
        run: bash tests/run_tests.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned LVGL font converter
        run: npm install --global lv_font_conv@1.5.3
      - name: Download 16 OFL sources (13 requested, 3 compatible replacements)
        run: python3 tools/generate_clock_fonts.py
      - name: Verify font coverage and generated sizes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('main/generated_clock_fonts/manifest.json').read_text())
          assert len(manifest)==16
          assert all(x['size_bytes']>1000 and x['size_bytes']<2000000 for x in manifest)
          print('PASS: 16 converted families validated')
          PY
      - name: ESP-IDF ESP32-S3 compile, do not publish firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
      - name: Validate draft OTA app size and partitions
        run: python3 tools/check_build.py build/lyricflash.bin
      - uses: actions/upload-artifact@v4
        with:
          name: LyricFlash-0.8.62-fonts-compile-only-UNTESTED
          path: |
            build/lyricflash.bin
            main/generated_clock_fonts/manifest.json
          if-no-files-found: error
