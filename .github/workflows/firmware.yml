
name: LyricFlash Alpha 0.3 - ESP32-S3 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out firmware source
        uses: actions/checkout@v5

      - name: Run host tests before compiling
        run: bash tests/run_tests.sh

      - name: Compile LyricFlash for ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3

      - name: Verify generated application image
        run: python3 tools/check_build.py build/lyricflash.bin

      - name: Package firmware
        run: |
          mkdir -p dist
          cp build/lyricflash.bin dist/LyricFlash_Alpha_0.3_ESP32S3_OTA.bin
          python3 tools/check_build.py build/lyricflash.bin --json > dist/build-checks.json
          sha256sum dist/*.bin > dist/SHA256SUMS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricFlash-Alpha-0.3-ESP32S3-UNTESTED
          path: dist/
          if-no-files-found: error
