name: LyricFlash Private Alpha 0.8.72 - ESP32-S3 Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/private-0.8.72-sleep-timer-with-wake-fix
    paths:
      - '.github/workflows/firmware.yml'
      - 'main/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'partitions.csv'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out firmware source
        uses: actions/checkout@v5
      - name: Run all host and native source tests before compiling
        run: bash tests/run_tests.sh

  esp32s3:
    # Only an explicit release-gated commit may spend minutes on ESP-IDF.
    # Other branch pushes run inexpensive preflight and do NOT compile.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[compile-once]'))
    needs: preflight
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out verified source
        uses: actions/checkout@v5
      - name: Configure pinned LVGL font generator
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned font converter
        run: npm install --global lv_font_conv@1.5.3
      - name: Generate all 16 open-source embedded fonts before ESP-IDF compilation
        run: python3 tools/generate_clock_fonts.py
      - name: Verify complete generated font manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("main/generated_clock_fonts/manifest.json").read_text())
          assert len(m)==16, f"Only {len(m)} of 16 font families generated"
          assert all(1000 < x["size_bytes"] < 2000000 for x in m)
          print("PASS: all 16 embedded font families validated")
          PY
      - name: Compile LyricFlash for ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
      - name: Merge complete USB recovery image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: idf.py merge-bin -o lyricflash-full.bin -f raw
      - name: Validate OTA app and merged USB image
        run: |
          python3 tools/check_build.py build/lyricflash.bin
          python3 tools/validate_full_image.py build/lyricflash-full.bin build/lyricflash.bin
      - name: Package and verify mandatory USB, OTA and checksummed ZIP
        run: |
          mkdir -p _site/beta/firmware dist
          cp -a docs/. _site/
          cp build/lyricflash-full.bin _site/beta/firmware/lyricflash-full.bin
          cp build/lyricflash.bin _site/beta/firmware/lyricflash-ota.bin
          python3 tools/prepare_site.py _site
          python3 tools/create_preserve_usb.py _site
          python3 tools/package_release.py _site
          python3 tools/package_release.py --verify _site
          cp _site/beta/firmware/LyricFlash-0.8.72-alpha-USB-and-OTA.zip dist/
          cp build/lyricflash.bin dist/LyricFlash_Private_Alpha_0.8.72_ESP32S3_OTA.bin
          cp build/lyricflash-full.bin dist/LyricFlash_Private_Alpha_0.8.72_ESP32S3_FULL_USB.bin
          cp _site/beta/firmware/SHA256SUMS.txt dist/
          cp main/generated_clock_fonts/manifest.json dist/clock-fonts-manifest.json
          python3 tools/check_build.py build/lyricflash.bin --json > dist/build-checks.json
          python3 tools/package_release.py --verify _site
      - name: Upload complete validated firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LyricFlash-Private-Alpha-0.8.72-ESP32S3-UNTESTED
          path: dist/
          if-no-files-found: error
      - name: Publish and verify direct HTTPS private alpha OTA image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/package_release.py --verify _site
          python3 tools/publish_alpha_ota.py _site/beta/firmware/lyricflash-ota.bin
      - name: Publish verified private alpha as a GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/package_release.py --verify _site
          VERSION=$(awk '/^#define LF_VERSION /{gsub(/"/,"",$3);print $3}' main/version.h)
          test "$VERSION" = "0.8.72-alpha"
          TAG="alpha-build-${GITHUB_SHA:0:12}"
          {
            echo "LyricFlash-OTA-Version: $VERSION"
            echo "LyricFlash-OTA-Direct: https://raw.githubusercontent.com/skiiirt1983/LyricFlash/alpha-ota/releases/$TAG/lyricflash-ota.bin"
            echo "Private-channel experimental alpha for the original Waveshare ESP32-S3 1.75-inch device; hardware verification pending."
            echo "Full USB recovery and settings-preserving USB installation ZIP validated; use the on-device OTA for an existing LyricFlash installation."
            echo "This is not the public stable v1.0 release."
          } > "$RUNNER_TEMP/lyricflash-release-notes.txt"
          gh release create "$TAG" \
            _site/beta/firmware/lyricflash-ota.bin \
            _site/beta/firmware/LyricFlash-0.8.72-alpha-USB-and-OTA.zip \
            --target "$GITHUB_SHA" \
            --title "LyricFlash $VERSION - Private Alpha (hardware untested)" \
            --notes-file "$RUNNER_TEMP/lyricflash-release-notes.txt" \
            --prerelease --latest=false
          gh release view "$TAG" --json tagName,isPrerelease,assets | \
            python3 -c 'import json,sys; p=json.load(sys.stdin); names={a["name"] for a in p["assets"]}; assert p["isPrerelease"]; assert "lyricflash-ota.bin" in names; assert "LyricFlash-0.8.72-alpha-USB-and-OTA.zip" in names; print("PASS: private-alpha GitHub prerelease published with OTA and full USB ZIP")'
