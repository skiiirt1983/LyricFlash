name: LyricFlash USB Build and Pages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/alpha-0-8-4-reliable-swipe, work/webui-first-no-pins, recovery/0.8.12-ota-stable-core, fix/0.8.13-touch-screen-lifecycle, fix/0.8.14-touch-button-ownership]
    paths:
      - 'docs/**'
      - 'main/**'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - '.github/workflows/pages-and-firmware.yml'
      - 'tools/**'
      - 'tests/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  preflight:
    # Fast tests only: no ESP-IDF installation, compilation, or firmware upload.
    # PR changes are cheap to validate even when unfinished.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fast source, browser JS and contract tests
        run: bash tests/run_tests.sh

  build:
    # Full firmware compilations are intentional: explicit manual validation,
    # or publishing main only. Never compile on every draft PR update.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/work/webui-first-no-pins' ||
        github.ref == 'refs/heads/recovery/0.8.12-ota-stable-core' ||
        github.ref == 'refs/heads/fix/0.8.13-touch-screen-lifecycle' ||
        github.ref == 'refs/heads/fix/0.8.14-touch-button-ownership') &&
       contains(github.event.head_commit.message, '[compile-once]'))
    needs: preflight
    permissions:
      contents: write # only this gated build job can publish alpha-prerelease assets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Compile firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
      - name: Merge bootloader partition table and app
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: idf.py merge-bin -o lyricflash-full.bin -f raw
      - name: Validate and prepare site
        run: |
          python3 tools/check_build.py build/lyricflash.bin
          python3 tools/validate_full_image.py build/lyricflash-full.bin build/lyricflash.bin
          mkdir -p _site/beta/firmware
          cp -a docs/. _site/
          cp build/lyricflash-full.bin _site/beta/firmware/lyricflash-full.bin
          cp build/lyricflash.bin _site/beta/firmware/lyricflash-ota.bin
          python3 tools/prepare_site.py _site
          python3 tools/create_preserve_usb.py _site
      - name: Mandatory full USB, OTA, manifest and ZIP release gate
        run: |
          python3 tools/package_release.py _site
          python3 tools/package_release.py --verify _site
      - name: Build verified public OTA version catalog (GitHub Releases)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/publish_build_catalog.py _site
      - name: Upload complete USB and OTA release
        uses: actions/upload-artifact@v4
        with:
          name: LyricFlash-Alpha-0.8.14-FULL-USB-and-OTA-UNTESTED
          path: |
            _site/beta/firmware/lyricflash-full.bin
            _site/beta/firmware/lyricflash-ota.bin
            _site/beta/firmware/lyricflash-otadata-reset.bin
            _site/beta/manifest-preserve.json
            _site/beta/firmware/SHA256SUMS.txt
            _site/beta/firmware/USB-INSTALL.txt
            _site/beta/firmware/LyricFlash-*.zip
            _site/beta/manifest.json
          if-no-files-found: error
      - name: Verify complete USB+OTA release again before deployment
        run: python3 tools/package_release.py --verify _site
      - name: Publish and verify direct HTTPS alpha OTA image
        if: (github.ref == 'refs/heads/work/webui-first-no-pins' || github.ref == 'refs/heads/recovery/0.8.12-ota-stable-core' || github.ref == 'refs/heads/fix/0.8.13-touch-screen-lifecycle' || github.ref == 'refs/heads/fix/0.8.14-touch-button-ownership') && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/publish_alpha_ota.py _site/beta/firmware/lyricflash-ota.bin
      - name: Publish validated development OTA as an alpha prerelease (never stable)
        if: (github.ref == 'refs/heads/work/webui-first-no-pins' || github.ref == 'refs/heads/recovery/0.8.12-ota-stable-core' || github.ref == 'refs/heads/fix/0.8.13-touch-screen-lifecycle' || github.ref == 'refs/heads/fix/0.8.14-touch-button-ownership') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(awk '/^#define LF_VERSION /{gsub(/"/,"",$3);print $3}' main/version.h)
          test -n "$VERSION"
          TAG="alpha-build-${GITHUB_SHA:0:12}"
          gh release create "$TAG" _site/beta/firmware/lyricflash-ota.bin \
            --target "$GITHUB_SHA" --title "LyricFlash $VERSION · Alpha ${GITHUB_SHA:0:8} (untested)" \
            --notes "LyricFlash-OTA-Version: $VERSION
          LyricFlash-OTA-Direct: https://raw.githubusercontent.com/skiiirt1983/LyricFlash/alpha-ota/releases/$TAG/lyricflash-ota.bin
          Automated validated ESP32-S3 application-only development build. Hardware untested. Experimental alpha channel; not an official stable release." \
            --prerelease --latest=false
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
