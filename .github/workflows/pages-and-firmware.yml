name: LyricFlash USB Build and Pages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/alpha-0-7-usb-ota]
    paths:
      - 'docs/**'
      - 'main/**'
      - 'partitions.csv'
      - 'sdkconfig.defaults'
      - '.github/workflows/pages-and-firmware.yml'
      - 'tools/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Test source
        run: bash tests/run_tests.sh
      - name: Compile firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
      - name: Merge bootloader partition table and app
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: idf.py merge-bin -o lyricflash-full.bin -f raw
      - name: Validate and prepare site
        run: |
          python3 tools/check_build.py build/lyricflash.bin
          python3 tools/validate_full_image.py build/lyricflash-full.bin build/lyricflash.bin
          mkdir -p _site/beta/firmware
          cp -a docs/. _site/
          cp build/lyricflash-full.bin _site/beta/firmware/lyricflash-full.bin
          cp build/lyricflash.bin _site/beta/firmware/lyricflash-ota.bin
          python3 tools/prepare_site.py _site
      - name: Package USB, OTA and checksums
        run: |
          cd _site/beta/firmware
          sha256sum lyricflash-full.bin lyricflash-ota.bin > SHA256SUMS.txt
          printf 'LyricFlash Alpha 0.7 (untested)\nUSB: flash lyricflash-full.bin at offset 0x0 to the Waveshare ESP32-S3 16MB device.\nOTA: use lyricflash-ota.bin only in the local PIN-protected OTA updater; never flash it at 0x0.\nA full-chip erase is NOT necessary and destroys saved settings.\n' > USB-INSTALL.txt
      - name: Upload complete USB and OTA release
        uses: actions/upload-artifact@v4
        with:
          name: LyricFlash-Alpha-0.7-FULL-USB-and-OTA-UNTESTED
          path: |
            _site/beta/firmware/
            _site/beta/manifest.json
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
